<!DOCTYPE html>
<!-- 404 page — the fallback GitHub Pages serves for any missing URL, copied
     from src/static/ into public/ by build.js. It is never rendered through
     the layout: no data file can feed it, and a template tag would reach the
     visitor as literal braces — check.sh greps all of public/ for them.
     Its colours are the one exception: build.js substitutes the token
     placeholders in this file from 01-tokens.css and the neutral block of
     01a-theme.css, so the page follows the site's neutral without a hand
     copy. It still loads nothing from the site: no bundle, no image, every
     style inline, because a relative asset URL resolves against that path's
     directory. The way home stays relative, never root-absolute: Pages
     serves the site under /<repo>/, so "/index.html" would miss it —
     ADR 0002, enforced by check.sh. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — dry pipe · Flow Battery Commons</title>
<meta name="robots" content="noindex">
<style>
  /* The site's roles, filled from the token layer at build time. */
  :root{
    --tank:{{token:--tank}};
    --tank-ink:{{token:--tank-ink}};
    --tank-ink-dim:{{token:--tank-ink-dim}};
    --tank-ink-faint:{{token:--tank-ink-faint}};
    --accent:{{token:--accent}};
    --accent-strong:{{token:--accent-strong}};
    --accent-deep:{{token:--accent-deep}};
    --accent-bright:{{token:--accent-bright}};
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--tank);color:var(--tank-ink);padding:40px 24px;text-align:center;
  }
  .card{max-width:520px}
  svg.flow-glyph{display:block;margin:0 auto 30px}
  h1{font-size:clamp(3.4rem,10vw,5rem);letter-spacing:-.02em;color:#fff;line-height:1}
  p{color:var(--tank-ink-dim);margin:18px 0 34px;font-size:16.5px;line-height:1.65}
  p b{color:var(--accent-bright)}
  a.btn{
    display:inline-flex;align-items:center;gap:9px;text-decoration:none;cursor:pointer;
    font-size:14.5px;font-weight:600;padding:12px 24px;border-radius:999px;
    background:var(--accent-deep);color:#fff;
    box-shadow:0 12px 24px -14px color-mix(in srgb, var(--accent-deep) 70%, transparent);
    transition:background .2s;
  }
  a.btn:hover{background:var(--accent-strong)}
  .hint{margin-top:26px;font-size:12.5px;color:var(--tank-ink-faint)}
  /* the glyph takes the roles through CSS: a presentation attribute cannot
     read var() */
  .g-pipe{stroke:var(--accent-strong)}
  .g-ring{stroke:var(--accent-bright)}
  .g-liquid{fill:var(--accent)}
  .g-drop{fill:var(--accent)}
</style>
</head>
<body>
  <div class="card">
    <svg class="flow-glyph" width="120" height="90" viewBox="0 0 120 90" aria-hidden="true">
      <path class="g-pipe" d="M60 6 C60 26 34 26 34 46" fill="none" stroke-width="10" stroke-linecap="round"/>
      <path class="g-pipe" d="M60 6 C60 26 86 26 86 46" fill="none" stroke-width="10" stroke-linecap="round"/>
      <circle class="g-ring" cx="34" cy="58" r="12" fill="none" stroke-width="3"/>
      <circle class="g-ring" cx="86" cy="58" r="12" fill="none" stroke-width="3"/>
      <path class="g-liquid" d="M22 62q6-6 12 0t12 0v14H22z" opacity=".9"/>
      <path class="g-liquid" d="M74 66q6-6 12 0t12 0v10H74z" opacity=".55"/>
      <circle class="g-drop" cx="60" cy="10" r="5"/>
    </svg>
    <h1>404</h1>
    <p>This pipe runs to an empty tank. The page you asked for has been valved off, renamed, or never existed — <b>even the best labs hit dry lines now and then.</b></p>
    <a class="btn" href="index.html">← Back to the commons</a>
    <p class="hint">If you followed a link from somewhere else, tell us on the forum so we can fix the fitting.</p>
  </div>
</body>
</html>
