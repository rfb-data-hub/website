<!-- Hero card — the animated flow-battery diagram; the hero's visual anchor.
     The allegory: the two tanks are the community's two online homes —
     Discord in the positive (yellow) tank, GitHub in the negative (red) one,
     at equal level — circulating through the cell of researcher avatars in
     the middle; what the circuit produces at the top is knowledge (bulb).
     The diagram is deliberately text-free, a pictogram, not a schematic.
     Marks carry the brand colours (.mark-dc / .mark-gh in 06-hero-card.css);
     the linework is neutral so the two electrolytes are the only chromatic
     things. Styles: 06-hero-card.css. -->
<div class="hero-card glass-card" data-reveal>
  <div class="hero-card-head">
    <span class="hero-card-title"></span>
  </div>

  <div class="hero-card-float">
  <svg class="hero-card-svg" id="hero-card" viewBox="0 24 620 446" role="img" aria-label="Animated diagram of a flow battery: two equally full electrolyte tanks carrying the coloured Discord and GitHub marks feed a central stack of diverse researcher avatars under a lightbulb, with counter-rotating pumps and circulating liquid">
    <defs>
      <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#5C6166" stop-opacity=".42"/>
        <stop offset="1" stop-color="#5C6166" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="posGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F7DE5A"/><stop offset="1" stop-color="#E3BE0E"/>
      </linearGradient>
      <linearGradient id="negGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F58484"/><stop offset="1" stop-color="#DE4A4A"/>
      </linearGradient>
      <clipPath id="clipPos"><rect x="43" y="173" width="126" height="206" rx="14"/></clipPath>
      <clipPath id="clipNeg"><rect x="451" y="173" width="126" height="206" rx="14"/></clipPath>
      <clipPath id="clipStack"><rect x="245.5" y="129.5" width="129" height="191" rx="12.5"/></clipPath>
      <path id="wavePath" d="M-120 246 q16.5 -9 33 0 t33 0 t33 0 t33 0 t33 0 t33 0 t33 0 t33 0 t33 0 t33 0 t33 0 L243 430 L-120 430 Z"/>
    </defs>

    <!-- pipes: base -->
    <g fill="none" stroke="#2E3033" stroke-width="12" stroke-linecap="round">
      <path d="M106 382 L106 424 Q106 434 116 434 L258 434 Q268 434 268 424 L268 322"/>
      <path d="M268 128 L268 92 Q268 82 258 82 L116 82 Q106 82 106 92 L106 170"/>
      <path d="M514 382 L514 424 Q514 434 504 434 L362 434 Q352 434 352 424 L352 322"/>
      <path d="M352 128 L352 92 Q352 82 362 82 L504 82 Q514 82 514 92 L514 170"/>
    </g>
    <!-- pipes: flowing electrolyte -->
    <g fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 18">
      <path class="flow" stroke="#F2D024" d="M106 382 L106 424 Q106 434 116 434 L258 434 Q268 434 268 424 L268 322"/>
      <path class="flow slow" stroke="#F2D024" d="M268 128 L268 92 Q268 82 258 82 L116 82 Q106 82 106 92 L106 170"/>
      <path class="flow" stroke="#EE5C5C" d="M514 382 L514 424 Q514 434 504 434 L362 434 Q352 434 352 424 L352 322"/>
      <path class="flow slow" stroke="#EE5C5C" d="M352 128 L352 92 Q352 82 362 82 L504 82 Q514 82 514 92 L514 170"/>
    </g>
    <!-- flow direction arrows -->
    <g fill="#2E3033" opacity=".55">
      <path d="M170 428 l10 6 -10 6z"/><path d="M196 76 l-10 6 10 6z"/>
      <path d="M450 428 l-10 6 10 6z"/><path d="M424 76 l10 6 -10 6z"/>
    </g>

    <!-- stack glow -->
    <ellipse class="glow" cx="310" cy="225" rx="120" ry="130" fill="url(#glowGrad)"/>

    <!-- community cell: the stack is where the people are — real avatars
         (assets/img/avatars) in a loose crowd: 17 discs of 27–36 units
         (≈ 20–27 px on screen) in five staggered rows, each tilted a few
         degrees, all at full opacity. Small + many so the cell reads as a
         crowd and matches the orbit's innermost ring (24 px,
         scripts/gen-orbit.py). Rows paint top → bottom, centre face last. -->
    <g>
      <rect x="244" y="128" width="132" height="194" rx="14" fill="#fff" stroke="#17181A" stroke-width="3"/>
      <g clip-path="url(#clipStack)">
        <image href="assets/img/avatars/avatar-18.svg" x="252.9" y="134" width="27" height="27" transform="rotate(-6 266.4 147.5)"/>
        <image href="assets/img/avatars/avatar-16.svg" x="297" y="134.7" width="28" height="28" transform="rotate(1.2 311 148.7)"/>
        <image href="assets/img/avatars/avatar-12.svg" x="342.3" y="130.3" width="29" height="29" transform="rotate(5.7 356.8 144.8)"/>
        <image href="assets/img/avatars/avatar-19.svg" x="246" y="167.5" width="28" height="28" transform="rotate(-3.1 260 181.5)"/>
        <image href="assets/img/avatars/avatar-08.svg" x="274.8" y="170.2" width="33" height="33" transform="rotate(2.2 291.3 186.7)"/>
        <image href="assets/img/avatars/avatar-07.svg" x="312" y="167.1" width="29" height="29" transform="rotate(-7 326.5 181.6)"/>
        <image href="assets/img/avatars/avatar-20.svg" x="345.8" y="169.3" width="28" height="28" transform="rotate(-3 359.8 183.3)"/>
        <image href="assets/img/avatars/avatar-04.svg" x="251.1" y="206.3" width="31" height="31" transform="rotate(4.7 266.6 221.8)"/>
        <image href="assets/img/avatars/avatar-01.svg" x="338.3" y="206.2" width="33" height="33" transform="rotate(7.7 354.8 222.7)"/>
        <image href="assets/img/avatars/avatar-10.svg" x="247.5" y="246.8" width="27" height="27" transform="rotate(-5.6 261 260.3)"/>
        <image href="assets/img/avatars/avatar-06.svg" x="275.2" y="246.3" width="30" height="30" transform="rotate(4.2 290.2 261.3)"/>
        <image href="assets/img/avatars/avatar-17.svg" x="313.6" y="244.1" width="31" height="31" transform="rotate(3.1 329.1 259.6)"/>
        <image href="assets/img/avatars/avatar-09.svg" x="343.5" y="245" width="31" height="31" transform="rotate(5.4 359 260.5)"/>
        <image href="assets/img/avatars/avatar-14.svg" x="249.8" y="284" width="34" height="34" transform="rotate(-7 266.8 301)"/>
        <image href="assets/img/avatars/avatar-03.svg" x="295.2" y="286" width="32" height="32" transform="rotate(5.2 311.2 302)"/>
        <image href="assets/img/avatars/avatar-02.svg" x="338.1" y="284" width="28" height="28" transform="rotate(-7.6 352.1 298)"/>
        <image href="assets/img/avatars/avatar-15.svg" x="290" y="205.9" width="36" height="36" transform="rotate(0.4 308 223.9)"/>
      </g>
    </g>

    <!-- lightbulb badge: what the circuit is for — knowledge. Neutral white
         disc with a neutral near-black stroke icon in the site's own style
         (see data/icons.js), drawn on the 24-grid and scaled 1.1. -->
    <g class="bulb"><circle cx="310" cy="52" r="17" fill="#fff" stroke="#17181A" stroke-width="2.5"/>
      <g transform="translate(296.8 37.8) scale(1.1)" fill="none" stroke="#17181A"
         stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/>
        <path d="M9 18h6"/>
        <path d="M10 22h4"/>
      </g></g>

    <!-- pumps: each impeller wears the colour of the electrolyte it moves
         (.impeller-dc / .impeller-gh in 06-hero-card.css) -->
    <g>
      <circle cx="180" cy="434" r="21" fill="#fff" stroke="#17181A" stroke-width="3"/>
      <g class="impeller rev impeller-dc">
        <!-- invisible square recentres the fill-box on the hub (180,434):
             the blade paths' own bbox centre sits ~6px above it, which made
             the spin wobble. fill:none still counts into the bbox.
             One blade, rotated 120°/240° about the hub → even spacing. -->
        <rect x="160" y="414" width="40" height="40" fill="none"/>
        <path d="M180 434 q-4 -13 4 -16 q6 8 -4 16z"/>
        <path d="M180 434 q-4 -13 4 -16 q6 8 -4 16z" transform="rotate(120 180 434)"/>
        <path d="M180 434 q-4 -13 4 -16 q6 8 -4 16z" transform="rotate(240 180 434)"/>
      </g>
      <circle cx="180" cy="434" r="3.4" fill="#17181A"/>
      <circle cx="440" cy="434" r="21" fill="#fff" stroke="#17181A" stroke-width="3"/>
      <g class="impeller impeller-gh" style="animation-delay:-1.3s">
        <rect x="420" y="414" width="40" height="40" fill="none"/>
        <path d="M440 434 q-4 -13 4 -16 q6 8 -4 16z"/>
        <path d="M440 434 q-4 -13 4 -16 q6 8 -4 16z" transform="rotate(120 440 434)"/>
        <path d="M440 434 q-4 -13 4 -16 q6 8 -4 16z" transform="rotate(240 440 434)"/>
      </g>
      <circle cx="440" cy="434" r="3.4" fill="#17181A"/>
    </g>

    <!-- positive tank -->
    <g>
      <rect x="40" y="170" width="132" height="212" rx="18" fill="#fff" stroke="#17181A" stroke-width="3"/>
      <g clip-path="url(#clipPos)">
        <g class="level level-pos">
          <g class="wave"><use href="#wavePath" x="0" y="0" fill="url(#posGrad)"/></g>
          <circle class="bubble" cx="80" cy="360" r="5" fill="rgba(255,255,255,.8)"/>
          <circle class="bubble" cx="118" cy="372" r="4" fill="rgba(255,255,255,.75)" style="animation-delay:1.4s"/>
          <circle class="bubble" cx="145" cy="364" r="3" fill="rgba(255,255,255,.7)" style="animation-delay:2.7s"/>
        </g>
      </g>
      <!-- Discord badge: the yellow tank is the Discord side of the community -->
      <g class="tank-mark">
        <circle cx="106" cy="276" r="34" fill="#fff" stroke="#17181A" stroke-width="3"/>
        <g class="mark-dc" transform="translate(86 256) scale(1.6667)">
          <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
        </g>
      </g>
    </g>

    <!-- negative tank -->
    <g>
      <rect x="448" y="170" width="132" height="212" rx="18" fill="#fff" stroke="#17181A" stroke-width="3"/>
      <g clip-path="url(#clipNeg)">
        <g class="level level-neg">
          <g class="wave rev"><use href="#wavePath" x="408" y="0" fill="url(#negGrad)"/></g>
          <circle class="bubble" cx="490" cy="360" r="5" fill="rgba(255,255,255,.8)" style="animation-delay:.8s"/>
          <circle class="bubble" cx="528" cy="370" r="4" fill="rgba(255,255,255,.75)" style="animation-delay:2.2s"/>
          <circle class="bubble" cx="553" cy="362" r="3" fill="rgba(255,255,255,.7)" style="animation-delay:3.4s"/>
        </g>
      </g>
      <!-- GitHub badge: the red tank is the GitHub side of the community -->
      <g class="tank-mark">
        <circle cx="514" cy="276" r="34" fill="#fff" stroke="#17181A" stroke-width="3"/>
        <g class="mark-gh" transform="translate(494 256) scale(1.6667)">
          <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
        </g>
      </g>
    </g>
  </svg>
  </div>

  <div class="hero-card-foot">
    <span class="foot-dc">DISCORD</span>
    <span class="foot-gh">GITHUB</span>
  </div>
</div>
